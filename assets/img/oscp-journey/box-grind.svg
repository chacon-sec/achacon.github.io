<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="Bar chart of machines completed: 60 on Hack The Box, 40 on Proving Grounds, 4 challenge labs">
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
    <!-- title -->
    <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">The Grind — ~104 machines &amp; labs in 10 months</text>

    <!-- row labels -->
    <g font-size="12" fill="#e6edf3" text-anchor="end">
      <text x="170" y="79">Hack The Box</text>
      <text x="170" y="124">Proving Grounds</text>
      <text x="170" y="169">Challenge Labs</text>
    </g>

    <!-- bars -->
    <rect x="180" y="60" width="550" height="30" rx="4" fill="#ff4d4d"/>
    <rect x="180" y="105" width="366.7" height="30" rx="4" fill="#a371f7"/>
    <rect x="180" y="150" width="36.7" height="30" rx="4" fill="#238636"/>

    <!-- values -->
    <text x="720" y="79" text-anchor="end" font-size="12" fill="#ffffff">60 boxes · 8 months</text>
    <text x="536.7" y="124" text-anchor="end" font-size="12" fill="#ffffff">40 boxes · 6 weeks</text>
    <text x="226.7" y="169" text-anchor="start" font-size="12" fill="#8b949e">4 labs · 1 weekend</text>

    <!-- footer -->
    <text x="380" y="215" text-anchor="middle" font-size="11" fill="#8b949e">~70 of these were knocked out in the final 45 days before the exam</text>
  </g>
</svg>
